[project]
name = "breakneck"
version = "0.4.0"
authors = [{ name = "Matti Airas", email = "matti.airas@hatlabs.fi" }]
description = "DRC-checked placement of return, pad and pour stitching vias, return and coverage heatmaps and manual neckdowns for KiCad"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Utilities",
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["KiCad", "EDA", "PCB", "stitching", "neckdown", "breakneck"]

dependencies = [
    "kicad-python >= 0.8.0",
    "loguru>=0.7.2",
    "matplotlib>=3.10.0",
    "numpy>=2.0",
    "scikit-image>=0.25",
    "scipy>=1.14",
    "shapely>=2.0.7",
    "svgpathtools>=1.6.1",
]

[project.urls]
Homepage = "https://github.com/hatlabs/breakneck"

[project.scripts]
breakneck = "breakneck.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.4",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["docs/images"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default; pass `-n 0` to run serially (e.g. for pdb).
addopts = "-n auto"
